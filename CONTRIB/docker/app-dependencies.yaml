# ======================================================================
# Docker Compose file for running MySQL and a GUI tool (phpMyAdmin) for development.
# 
# To run:
# > docker-compose -f CONTRIB/docker/app-dependencies.yaml up -d
#
# To stop:
# > docker-compose -f CONTRIB/docker/app-dependencies.yaml down
#
# After running, you can access:
# - phpMyAdmin at http://localhost:8080
# - MySQL at mysql://root:admin@localhost:3306
# ======================================================================

version: '3.8'

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: ptracker
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - mysql-dev-data:/var/lib/mysql
    ports:
      - "3306:3306"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: admin
    ports:
      - "8085:80"
    depends_on:
      - mysql

volumes:
  mysql-dev-data:
    driver: local
